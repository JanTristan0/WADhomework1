<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostIt - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="addPost.html">Add Post</a>
      <a class="profile-link" href="login.html" aria-current="page" aria-label="Current login page">
        <img src="images/avatar.svg" alt="Profile">
      </a>
    </nav>
  </header>

  <main class="page-shell centered-page">
    <section class="form-card login-card" aria-labelledby="login-title">
      <h1 id="login-title">Welcome to PostIt</h1>
      <a class="secondary-link" href="#create-account">Create an account</a>
      <p class="or-text">or</p>
      <p>Please log in</p>

      <form action="index.html" method="get">
        <label class="form-field">
          <span>Email</span>
          <input type="email" name="email" placeholder="Email" required>
        </label>

        <label class="form-field">
          <span>Password</span>
          <input type="password" name="password" placeholder="Password" required minlength="1">
        </label>

        <section class="form-actions" aria-label="Form actions">
          <button class="primary-button" type="submit">Log in</button>
        </section>
      </form>

      <a class="secondary-link" href="#forgot-password">Forget password</a>
    </section>
  </main>

  <footer class="site-footer">
    <p>PostIt • Homework #1</p>
  </footer>
</body>
</html>
